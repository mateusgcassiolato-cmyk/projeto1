<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis Racket 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #03140f; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.162.0/three.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// --- Scene ---
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 4.5);
camera.lookAt(0, 0.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- Lighting ---
scene.add(new THREE.AmbientLight(0x334455, 0.6));

const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
mainLight.position.set(3, 5, 4);
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0x3ee9d4, 0.8);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

const bottomLight = new THREE.DirectionalLight(0xd8f84a, 0.3);
bottomLight.position.set(0, -3, 1);
scene.add(bottomLight);

const spotLight = new THREE.SpotLight(0x3ee9d4, 1.5, 12, Math.PI / 6, 0.4);
spotLight.position.set(2, 4, 3);
scene.add(spotLight);

// --- Materials ---
const frameMat = new THREE.MeshPhysicalMaterial({
  color: 0x1a1a2e, metalness: 0.85, roughness: 0.15,
  clearcoat: 1.0, clearcoatRoughness: 0.05, reflectivity: 0.9,
});

const accentMat = new THREE.MeshPhysicalMaterial({
  color: 0x3ee9d4, metalness: 0.6, roughness: 0.2,
  emissive: 0x3ee9d4, emissiveIntensity: 0.15, clearcoat: 0.8,
});

const gripMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a2520, metalness: 0.1, roughness: 0.85, clearcoat: 0.2,
});

const stringMat = new THREE.MeshPhysicalMaterial({
  color: 0xd8f84a, metalness: 0.3, roughness: 0.4,
  emissive: 0xd8f84a, emissiveIntensity: 0.08,
  transparent: true, opacity: 0.85,
});

// --- Racket ---
const racketGroup = new THREE.Group();

// Head frame
const headW = 0.65, headH = 0.85;
const headShape = new THREE.Shape();
headShape.ellipse(0, 0, headW, headH, 0, Math.PI * 2, false, 0);
const headGeo = new THREE.ExtrudeGeometry(headShape, {
  depth: 0.08, bevelEnabled: true,
  bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 8, curveSegments: 64,
});
const headMesh = new THREE.Mesh(headGeo, frameMat);
headMesh.position.set(0, 1.2, 0);
racketGroup.add(headMesh);

// Inner accent ring
const ringOuter = new THREE.Shape();
ringOuter.ellipse(0, 0, headW - 0.04, headH - 0.04, 0, Math.PI * 2, false, 0);
const ringHole = new THREE.Shape();
ringHole.ellipse(0, 0, headW - 0.06, headH - 0.06, 0, Math.PI * 2, false, 0);
ringOuter.holes.push(ringHole);
const ringGeo = new THREE.ExtrudeGeometry(ringOuter, { depth: 0.085, bevelEnabled: false, curveSegments: 64 });
const ringMesh = new THREE.Mesh(ringGeo, accentMat);
ringMesh.position.set(0, 1.2, -0.002);
racketGroup.add(ringMesh);

// Strings — vertical
for (let i = 0; i < 14; i++) {
  const t = (i / 13) * 2 - 1;
  const x = t * (headW - 0.1);
  const maxY = Math.sqrt(Math.max(0, 1 - (x / (headW - 0.08)) ** 2)) * (headH - 0.1);
  if (maxY < 0.05) continue;
  const geo = new THREE.CylinderGeometry(0.006, 0.006, maxY * 2, 6);
  const mesh = new THREE.Mesh(geo, stringMat);
  mesh.position.set(x, 1.2, 0.04);
  racketGroup.add(mesh);
}

// Strings — horizontal
for (let i = 0; i < 18; i++) {
  const t = (i / 17) * 2 - 1;
  const y = t * (headH - 0.1);
  const maxX = Math.sqrt(Math.max(0, 1 - (y / (headH - 0.08)) ** 2)) * (headW - 0.1);
  if (maxX < 0.05) continue;
  const geo = new THREE.CylinderGeometry(0.006, 0.006, maxX * 2, 6);
  const mesh = new THREE.Mesh(geo, stringMat);
  mesh.rotation.z = Math.PI / 2;
  mesh.position.set(0, 1.2 + y, 0.04);
  racketGroup.add(mesh);
}

// Throat (Y-piece)
const tc1 = new THREE.CubicBezierCurve3(
  new THREE.Vector3(-0.18, 0.35, 0.04), new THREE.Vector3(-0.12, 0.15, 0.04),
  new THREE.Vector3(-0.04, 0.0, 0.04), new THREE.Vector3(0, -0.15, 0.04)
);
const tc2 = new THREE.CubicBezierCurve3(
  new THREE.Vector3(0.18, 0.35, 0.04), new THREE.Vector3(0.12, 0.15, 0.04),
  new THREE.Vector3(0.04, 0.0, 0.04), new THREE.Vector3(0, -0.15, 0.04)
);
racketGroup.add(new THREE.Mesh(new THREE.TubeGeometry(tc1, 20, 0.028, 8), frameMat));
racketGroup.add(new THREE.Mesh(new THREE.TubeGeometry(tc2, 20, 0.028, 8), frameMat));

// Throat bridge
const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.035, 0.06), accentMat);
bridge.position.set(0, 0.08, 0.04);
racketGroup.add(bridge);

// Shaft
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.035, 0.55, 12), frameMat);
shaft.position.set(0, -0.42, 0.04);
racketGroup.add(shaft);

// Grip
const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.042, 0.65, 8), gripMat);
grip.position.set(0, -1.0, 0.04);
racketGroup.add(grip);

// Grip wrap rings
for (let i = 0; i < 12; i++) {
  const wrap = new THREE.Mesh(new THREE.TorusGeometry(0.043, 0.004, 4, 12), accentMat);
  wrap.position.set(0, -0.72 - i * 0.05, 0.04);
  wrap.rotation.x = Math.PI / 2;
  wrap.rotation.z = i * 0.3;
  racketGroup.add(wrap);
}

// Butt cap
const butt = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.035, 0.04, 12), accentMat);
butt.position.set(0, -1.34, 0.04);
racketGroup.add(butt);

// Brand stripe
const stripe = new THREE.Mesh(new THREE.BoxGeometry(headW * 1.2, 0.04, 0.01), accentMat);
stripe.position.set(0, 1.55, 0.085);
racketGroup.add(stripe);

racketGroup.rotation.set(0.15, 0, -0.2);
racketGroup.position.set(0.3, 0.1, 0);
scene.add(racketGroup);

// --- Tennis Ball ---
const ballGeo = new THREE.SphereGeometry(0.18, 48, 48);
const ballMat = new THREE.MeshPhysicalMaterial({
  color: 0xc6ef22, roughness: 0.75, metalness: 0.0,
  clearcoat: 0.15, clearcoatRoughness: 0.8,
});
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.set(-1.0, 0.8, 0.5);
scene.add(ball);

const seamGeo = new THREE.TorusGeometry(0.175, 0.008, 8, 48);
const seamMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.6 });
const seam1 = new THREE.Mesh(seamGeo, seamMat);
seam1.position.copy(ball.position);
seam1.rotation.x = Math.PI / 3;
scene.add(seam1);

const seam2 = new THREE.Mesh(seamGeo.clone(), seamMat);
seam2.position.copy(ball.position);
seam2.rotation.set(-Math.PI / 3, Math.PI / 2, 0);
scene.add(seam2);

// --- Particles ---
const pCount = 60;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i * 3]     = (Math.random() - 0.5) * 6;
  pPos[i * 3 + 1] = (Math.random() - 0.5) * 5;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 3 - 1;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x3ee9d4, size: 0.025, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
scene.add(new THREE.Points(pGeo, pMat));

// --- Environment map ---
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x03140f);

const ep1 = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshBasicMaterial({ color: 0x3ee9d4, side: THREE.DoubleSide })
);
ep1.position.set(0, 5, -5); ep1.lookAt(0, 0, 0);
envScene.add(ep1);

const ep2 = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.MeshBasicMaterial({ color: 0xd8f84a, side: THREE.DoubleSide })
);
ep2.position.set(-5, 3, 3); ep2.lookAt(0, 0, 0);
envScene.add(ep2);

scene.environment = pmrem.fromScene(envScene, 0.04).texture;
pmrem.dispose();

// --- Mouse ---
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * 2 - 1;
});

// --- Animate ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Racket follows mouse smoothly
  const tgtY = mouseX * 0.3;
  const tgtX = mouseY * 0.15;
  racketGroup.rotation.y += (tgtY - racketGroup.rotation.y) * 0.04;
  racketGroup.rotation.x += (0.15 + tgtX - racketGroup.rotation.x) * 0.04;

  // Gentle float
  racketGroup.position.y = 0.1 + Math.sin(t * 0.6) * 0.08;
  racketGroup.rotation.z = -0.2 + Math.sin(t * 0.4) * 0.05;

  // Ball float
  ball.position.y = 0.8 + Math.sin(t * 0.8 + 1) * 0.12;
  ball.position.x = -1.0 + Math.sin(t * 0.5) * 0.08;
  ball.rotation.x = t * 0.3;
  ball.rotation.z = t * 0.2;
  seam1.position.copy(ball.position);
  seam1.rotation.x = Math.PI / 3 + t * 0.3;
  seam2.position.copy(ball.position);
  seam2.rotation.x = -Math.PI / 3 + t * 0.3;
  seam2.rotation.y = Math.PI / 2 + t * 0.2;

  // Particles drift
  for (let i = 0; i < pCount; i++) {
    pPos[i * 3 + 1] += Math.sin(t + i) * 0.0008;
    pPos[i * 3]     += Math.cos(t * 0.5 + i * 0.3) * 0.0005;
  }
  pGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
